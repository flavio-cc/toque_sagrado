# App de iPhone num Mac da nuvem (não precisa de Mac em casa).
# - simulador: compila sem assinatura a cada mudança, para garantir que o projeto está certo.
# - testflight: assina e envia ao TestFlight usando a chave da API do App Store Connect.
#   Roda só quando os segredos APPSTORE_KEY_ID, APPSTORE_ISSUER_ID e APPSTORE_PRIVATE_KEY
#   existem e TEAM_ID abaixo está preenchido. A versão vem de web/versao.js; o número do
#   build é o número desta execução, que sempre cresce (a Apple exige).
name: iOS

on:
  push:
    branches: [main]
    paths: ["web/**", "app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

env:
  TEAM_ID: "8BMT2F6K68" # Team ID da conta Apple Developer (Membership details); não é segredo

jobs:
  simulador:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run sync -- ios
      - name: Compilar para o simulador
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  testflight:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Conferir se a conta Apple está configurada
        id: pronto
        working-directory: .
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$PRIVATE_KEY" ] && [ -n "$TEAM_ID" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight pulado: faltam os segredos da chave da API ou o TEAM_ID."
          fi
      - if: steps.pronto.outputs.ok
        uses: actions/checkout@v5
      - if: steps.pronto.outputs.ok
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - if: steps.pronto.outputs.ok
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: steps.pronto.outputs.ok
        run: npm ci && npm run sync -- ios
      - name: Assinar e enviar ao TestFlight
        if: steps.pronto.outputs.ok
        working-directory: app/ios/App
        run: |
          VERSAO=$(sed -n 's/.*VERSAO = "\([0-9.]*\)".*/\1/p' ../../../web/versao.js)
          CHAVE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$CHAVE"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $CHAVE -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          cat > "$RUNNER_TEMP/exportar.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$VERSAO" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO archive
          # O arquivo sai sem assinatura (assinar aqui exigiria um iPhone cadastrado na conta).
          # Quem assina é a exportação: certificado de distribuição gerenciado pela Apple na nuvem.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportar.plist" -exportPath "$RUNNER_TEMP/saida" $AUTH
          rm -f "$CHAVE"
          echo "::notice::Versão $VERSAO (build ${{ github.run_number }}) enviada ao App Store Connect; aparece no TestFlight em alguns minutos."
