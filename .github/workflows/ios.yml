# Compila o app de iPhone num Mac da nuvem para garantir que o projeto está certo.
# Sem conta Apple ainda, compila para o simulador (sem assinatura). Quando a conta
# existir, este arquivo ganha o passo que assina e envia para o TestFlight.
name: iOS

on:
  push:
    branches: [main]
    paths: ["web/**", "app/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  simulador:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run sync -- ios
      - name: Compilar para o simulador
        working-directory: app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
